# Tessl Code Review profile for the Agent of Empires OMP plugin. The App reads
# this file from the default branch and routes each lens to the files a pull
# request touches. Keep every default lens listed: this list replaces the
# built-in set, so a lens left out simply never runs.
# https://docs.tessl.io/reference/configuration.md#tessl-code-reviewyml
schemaVersion: 1
effort: adaptive

# Release tooling owns the changelog; the manifest test lockfile is regenerated
# by cargo and says nothing about the extension.
ignore:
  - CHANGELOG.md
  - tests/manifest/Cargo.lock

lenses:
  - ref: tessl/code-review@0.5.2#review-markdown
    globs:
      - '**/*.md'
  - ref: tessl/code-review@0.5.2#review-correctness-and-data-integrity
    globs:
      - '**'
      - '!**/*.md'
  - ref: tessl/code-review@0.5.2#review-maintainability-and-code-quality
    globs:
      - '**'
      - '!**/*.md'
  - ref: tessl/code-review@0.5.2#review-scale-and-resilience
    globs:
      - '**'
      - '!**/*.md'
  # Skills, rules and agent instructions run with write tokens; keep the
  # security lens over the whole change.
  - ref: tessl/code-review@0.5.2#review-security-and-privacy
    globs:
      - '**'
