name: Check OMP releases

on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: omp-release-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Find latest stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh api repos/can1357/oh-my-pi/releases/latest --jq .tag_name)"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected OMP release tag: $tag"
            exit 1
          fi
          version="${tag#v}"
          state="$(node scripts/update-omp-version.mjs check "$version")"
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "state=$state"
          } >> "$GITHUB_OUTPUT"
      - name: Download and verify released OMP
        if: steps.release.outputs.state == 'update'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo can1357/oh-my-pi --pattern 'omp-linux-x64' --pattern 'SHA256SUMS.txt' --dir "$RUNNER_TEMP/omp"
          cd "$RUNNER_TEMP/omp"
          expected="$(awk '$2 == "omp-linux-x64" || $2 == "*omp-linux-x64" { print $1 }' SHA256SUMS.txt)"
          [[ "$expected" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$expected" omp-linux-x64 | sha256sum -c -
          chmod +x omp-linux-x64
          test "$(./omp-linux-x64 --version)" = "omp/${TAG#v}"
      - name: Run plugin tests and native report smoke
        if: steps.release.outputs.state == 'update'
        run: |
          set -euo pipefail
          (cd omp-extension && bun test ../tests)
          OMP_BIN="$RUNNER_TEMP/omp/omp-linux-x64" OMP_STATUS_SMOKE=1 ./tests/omp-native-smoke.sh
      - name: Propose reviewed compatibility update
        if: steps.release.outputs.state == 'update'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          branch="automation/omp-${VERSION}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            number="$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // empty')"
            if [ -z "$number" ]; then
              echo "::error::Branch $branch exists without an open PR; inspect it manually"
              exit 1
            fi
            echo "::notice::Update PR #$number already exists"
            exit 0
          fi
          node scripts/update-omp-version.mjs apply "$VERSION"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add aoe-plugin.toml omp-extension/package.json
          git commit -m "fix(omp): support ${VERSION}"
          git push origin "$branch"
          gh pr create --draft --base main --head "$branch" \
            --title "fix(omp): support ${VERSION}" \
            --body "OMP ${TAG} passed the Bun suite and the isolated startup/report smoke. Review runtime and reply compatibility before merging; this smoke does not exercise interactive replies. PRs created with GITHUB_TOKEN do not trigger normal PR workflows, so a maintainer must run required checks through the repository's normal gates."
