name: Release

# Merging the release-please PR (release-please.yml) creates the `vX.Y.Z` tag and
# a GitHub Release whose notes are that version's CHANGELOG.md section, having
# already bumped omp-extension/package.json and aoe-plugin.toml. This workflow
# re-runs the checks, refuses a tag that disagrees with either version field, and
# attaches a source archive and its sha256 to that release.
#
# workflow_dispatch is the manual fallback: for a release created with
# GITHUB_TOKEN, which starts no workflows, or for a version cut by hand before
# release-please was adopted. It creates the release when there is none yet.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.6.0)"
        required: true

permissions:
  contents: read

env:
  # One rule for "which tag do we operate on", so checkout and publishing agree.
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.event.release.tag_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: cd omp-extension && bun test ../tests

      - name: Validate version matches tag
        run: |
          set -euo pipefail
          TAG_VERSION="${RELEASE_TAG#v}"
          PACKAGE_VERSION="$(node -p "require('./omp-extension/package.json').version")"
          MANIFEST_VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("aoe-plugin.toml","rb"))["version"])')"
          echo "tag:             $TAG_VERSION"
          echo "omp-extension:   $PACKAGE_VERSION"
          echo "aoe-plugin.toml: $MANIFEST_VERSION"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ] || [ "$MANIFEST_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $RELEASE_TAG disagrees with omp-extension/package.json ($PACKAGE_VERSION) or aoe-plugin.toml ($MANIFEST_VERSION)."
            echo "Tags come from merging the release-please PR, which bumps both fields first."
            exit 1
          fi

      - name: Build source archive
        run: |
          set -euo pipefail
          NAME="plugin-omp-${RELEASE_TAG}"
          git archive --format=tar.gz --prefix="${NAME}/" -o "${NAME}.tar.gz" HEAD
          sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"
          cat "${NAME}.tar.gz.sha256"

      - name: Extract release notes
        run: |
          set -euo pipefail
          # The release PR wrote this version's section into CHANGELOG.md.
          awk -v v="${RELEASE_TAG#v}" '
            index($0, "## ") == 1 {
              if (found) exit
              found = (index($0, "## [" v "]") == 1) || ($0 == "## " v)
              next
            }
            found
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "No user-facing changes." > release-notes.md
          fi
          cat release-notes.md

      - name: Attach the archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NAME="plugin-omp-${RELEASE_TAG}"
          # release-please already created this release; only a hand-cut tag from
          # the dispatch fallback still needs one.
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" \
              "${NAME}.tar.gz" "${NAME}.tar.gz.sha256" --clobber
          else
            gh release create "${RELEASE_TAG}" \
              --title "${RELEASE_TAG}" \
              --notes-file release-notes.md \
              "${NAME}.tar.gz" "${NAME}.tar.gz.sha256"
          fi
