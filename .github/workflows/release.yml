name: Release

# Tag vX.Y.Z to publish a GitHub Release with a source archive and its sha256.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: cd omp-extension && bun test ../tests

      - name: Build source archive
        run: |
          TAG=${{ github.ref_name }}
          NAME=plugin-omp-${TAG}
          git archive --format=tar.gz --prefix="${NAME}/" -o "${NAME}.tar.gz" HEAD
          sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=${{ github.ref_name }}
          NAME=plugin-omp-${TAG}
          gh release create "${TAG}" \
            --title "${TAG}" \
            --generate-notes \
            "${NAME}.tar.gz" "${NAME}.tar.gz.sha256"
