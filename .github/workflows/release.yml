name: Release

# Merging the release-please PR (release-please.yml) creates the `vX.Y.Z` tag and
# a GitHub Release whose notes are that version's CHANGELOG.md section, having
# already bumped omp-extension/package.json and aoe-plugin.toml. This workflow
# re-runs the checks, refuses a tag that disagrees with either version field, and
# attaches a source archive and its sha256 to that release.
#
# It runs two ways. `workflow_call` is how release-please.yml reaches it on the
# run that created the release: a release created with GITHUB_TOKEN starts no
# `published` workflow, and calling a reusable workflow is not an event, so no
# PAT is involved. `workflow_dispatch` publishes a version cut by hand before
# release-please was adopted, creating the release when there is none yet.
#
# A dispatch may name a tag that does not exist yet, which is how the bootstrap
# release is cut: checkout cannot resolve a missing ref, so the job resolves the
# tag when it is there and otherwise releases the dispatched commit, letting
# `gh release create --target` put the tag on that same commit.

on:
  workflow_call:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.6.0)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.6.0)"
        required: true

permissions:
  contents: read

env:
  # `inputs` covers both entry points, so checkout and publishing agree.
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve the ref to release
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "ref=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "::notice::${RELEASE_TAG} does not exist yet; releasing ${GITHUB_SHA} and tagging it there."
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: cd omp-extension && bun test ../tests

      - name: Validate version matches tag
        run: |
          set -euo pipefail
          TAG_VERSION="${RELEASE_TAG#v}"
          PACKAGE_VERSION="$(node -p "require('./omp-extension/package.json').version")"
          MANIFEST_VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("aoe-plugin.toml","rb"))["version"])')"
          echo "tag:             $TAG_VERSION"
          echo "omp-extension:   $PACKAGE_VERSION"
          echo "aoe-plugin.toml: $MANIFEST_VERSION"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ] || [ "$MANIFEST_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $RELEASE_TAG disagrees with omp-extension/package.json ($PACKAGE_VERSION) or aoe-plugin.toml ($MANIFEST_VERSION)."
            echo "Tags come from merging the release-please PR, which bumps both fields first."
            exit 1
          fi

      - name: Build source archive
        run: |
          set -euo pipefail
          NAME="plugin-omp-${RELEASE_TAG}"
          git archive --format=tar.gz --prefix="${NAME}/" -o "${NAME}.tar.gz" HEAD
          sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"
          cat "${NAME}.tar.gz.sha256"

      - name: Extract release notes
        run: |
          set -euo pipefail
          # The release PR wrote this version's section into CHANGELOG.md.
          awk -v v="${RELEASE_TAG#v}" '
            index($0, "## ") == 1 {
              if (found) exit
              found = (index($0, "## [" v "]") == 1) || ($0 == "## " v)
              next
            }
            found
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "No user-facing changes." > release-notes.md
          fi
          cat release-notes.md

      - name: Attach the archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NAME="plugin-omp-${RELEASE_TAG}"
          # release-please already created this release; only a hand-cut tag from
          # the dispatch fallback still needs one.
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" \
              "${NAME}.tar.gz" "${NAME}.tar.gz.sha256" --clobber
          else
            # The tag does not exist, so this creates it on the commit that was
            # checked out and validated rather than wherever main points later.
            gh release create "${RELEASE_TAG}" \
              --target "$(git rev-parse HEAD)" \
              --title "${RELEASE_TAG}" \
              --notes-file release-notes.md \
              "${NAME}.tar.gz" "${NAME}.tar.gz.sha256"
          fi
